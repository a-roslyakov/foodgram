server {
  server_tokens off;
  listen 80;

  location /media/ {
    alias /app/media/;
  }

  location /api/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:8000/api/;
  }
  location /admin/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:8000/admin/;
  }

  location / {
    alias /static/;
    index index.html;
    try_files $uri $uri/ /index.html;
  }
}

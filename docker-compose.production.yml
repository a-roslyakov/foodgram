volumes:
  pg_data:
  static:
  media:

services:
  db:
    image: postgres:15
    volumes:
      - pg_data:/var/lib/postgresql/data
    env_file: .env
  backend:
    image: roslyakov33/foodgram-backend
    env_file: .env
    volumes:
      - static:/backend_static
      - media:/app/media
    depends_on:
      - db
  frontend:
    env_file: .env
    image: roslyakov33/foodgram-frontend
    command: cp -r /app/build/. /static/
    volumes:
      - static:/static
  gateway:
    image: roslyakov33/foodgram-gateway
    env_file: .env
    ports:
      - 8000:80
    volumes:
      - static:/static
      - media:/app/media
    depends_on:
      - backend
      - frontend
    
